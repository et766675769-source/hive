<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message Board</title>
    <link rel="icon" href="assets/message-board-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── 左侧栏 ──────────────────────────────────────── -->
      <aside class="side">
        <div class="brand">
          <img class="brand__logo" src="assets/message-board-icon.png" alt="" />
          <div class="brand__text">
            <strong class="brand__name">Message Board</strong>
            <span class="brand__tag">AI 员工面板</span>
          </div>
          <button class="icon-btn" id="themeToggle" type="button" title="切换深浅色">◐</button>
        </div>

        <div class="side__scroll">
          <section class="group">
            <div class="group__head">
              <span class="group__label">项目</span>
              <button class="mini" id="newProject" type="button" title="新建项目">＋</button>
            </div>
            <ul class="tree" id="projectList"></ul>
          </section>

          <section class="group">
            <div class="group__head">
              <span class="group__label">团队</span>
              <button class="mini" id="newDepartment" type="button" title="新建部门">＋</button>
            </div>
            <ul class="tree" id="teamTree"></ul>
          </section>
        </div>

        <div class="side__foot">
          <button class="ghost ghost--block" id="openSettings" type="button">全局设置</button>
        </div>
      </aside>

      <!-- ── 主面板 ──────────────────────────────────────── -->
      <main class="main">
        <header class="main__head">
          <div class="main__meta">
            <span class="mode-badge" id="modeBadge">部门</span>
            <h1 class="main__title" id="panelTitle">还没有内容</h1>
            <p class="main__sub" id="panelSub">先在左侧建一个部门，再加几位员工</p>
          </div>
          <div class="roster" id="panelRoster"></div>
        </header>

        <div class="stream" id="stream"></div>

        <form class="composer" id="composer">
          <textarea id="composerInput" rows="1" placeholder="说点什么…　输入 @ 点名员工" autocomplete="off"></textarea>
          <button class="send" id="sendBtn" type="submit">发送</button>
        </form>
      </main>
    </div>

    <!-- 弹层 -->
    <div class="modal" id="modal" hidden>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <header class="modal__head">
          <h3 class="modal__title" id="modalTitle">标题</h3>
          <button class="ghost ghost--sm" id="modalClose" type="button" aria-label="关闭">✕</button>
        </header>
        <div class="modal__body" id="modalBody"></div>
        <footer class="modal__foot" id="modalFoot"></footer>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div class="ctxmenu" id="ctxmenu" hidden></div>

    <!-- 开机引导 -->
    <div class="onboard" id="onboard" hidden></div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
